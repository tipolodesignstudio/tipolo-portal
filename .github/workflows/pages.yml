name: Publish portal

# Builds the new app and publishes it at /beta/, next to the current portal, which is
# published exactly as before. Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the new app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          # the current portal, as GitHub Pages served it from the branch
          rsync -a ./ _site/ \
            --exclude '/_site' --exclude '/app' --exclude '/docs' \
            --exclude '/.github' --exclude '/.git' --exclude '/.gitignore' --exclude '/CLAUDE.md'
          # the new app at /beta/
          cp -R app/dist _site/beta
          # GitHub Pages answers unknown paths with /404.html; serving the app there lets
          # /beta/projects and the like load the app, which then routes itself
          cp app/dist/index.html _site/404.html
          touch _site/.nojekyll
          test -f _site/CNAME && test -f _site/index.html && test -f _site/beta/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
