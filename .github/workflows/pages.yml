name: Publish portal

# Builds the portal and publishes it at portal.tipolo.ca, with the previous portal at
# /legacy/ for the screens not rebuilt yet. Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the new app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/legacy
          # the new app at the root
          cp -R app/dist/. _site/
          # GitHub Pages answers unknown paths with /404.html; serving the app there lets
          # /projects and the like load the app, which then routes itself
          cp app/dist/index.html _site/404.html
          # the previous portal, unchanged, at /legacy/ (its paths are all relative)
          rsync -a ./ _site/legacy/ \
            --exclude '/_site' --exclude '/app' --exclude '/docs' --exclude '/CNAME' \
            --exclude '/.github' --exclude '/.git' --exclude '/.gitignore' --exclude '/CLAUDE.md'
          # anyone who bookmarked the short-lived /beta/
          mkdir -p _site/beta
          printf '<meta http-equiv="refresh" content="0; url=/">' > _site/beta/index.html
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          test -f _site/CNAME && test -f _site/index.html && test -f _site/legacy/index.html && test -f _site/legacy/js/app.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
