<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The previous portal used hash routes (/#/projects/…), and Supabase's emailed
      // sign-in and password-reset links arrive as #access_token=…. Both belong to the
      // previous portal at /legacy/, so hand them over, hash intact, before this app
      // starts and reads them.
      (function () {
        var h = location.hash;
        if (h.indexOf("#/") === 0 || /access_token=|type=recovery|error_description=/.test(h)) {
          location.replace("/legacy/" + h);
        }
      })();
    </script>
    <title>Tipolo Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
