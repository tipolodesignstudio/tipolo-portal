<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The previous portal used hash routes (/#/projects/…). The pages kept their paths,
      // so an old bookmark goes straight to the same page here. (Supabase's emailed
      // #access_token=… links are left alone: the app reads those itself.)
      (function () {
        var h = location.hash;
        if (h.indexOf("#/") === 0) location.replace(h.slice(1) || "/");
      })();
    </script>
    <title>Tipolo Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
